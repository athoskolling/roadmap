<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap para dev júnior 2027</title>
<meta name="description" content="Roadmap de 17 semanas com requisitos, testes, dicas e soluções para chegar a dev júnior.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe6;
    --white: #fffdf8;
    --ink: #15130f;
    --yellow: #ffd23f;
    --pink: #ff7ab6;
    --blue: #7aa2ff;
    --green: #6ee7b7;
    --orange: #ff9f5a;
    --violet: #c4b5fd;
    --shadow: 6px 6px 0 var(--ink);
    --c: var(--yellow);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(rgba(21, 19, 15, .09) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  code {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: .88em;
    background: rgba(21, 19, 15, .08);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .label {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: .78rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin: 0;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  #view { animation: enter .45s cubic-bezier(.2, .8, .2, 1); }

  /* ---------- Hero ---------- */
  .hero { padding: 56px 0 40px; position: relative; }
  .hero h1 {
    font-size: clamp(3.2rem, 11vw, 8rem);
    line-height: .88;
    letter-spacing: -.035em;
    margin: 14px 0 20px;
    position: relative;
    z-index: 1;
  }
  .hero h1 em { font-style: normal; -webkit-text-stroke: 2px var(--ink); color: transparent; }
  .hero h1 .hl { color: var(--pink); -webkit-text-stroke: 2px var(--ink); }
  .lede { font-size: 1.15rem; max-width: 38ch; margin: 0; position: relative; z-index: 1; }
  .score {
    position: absolute; right: 0; top: 64px; z-index: 2;
    background: var(--yellow); border: 3px solid var(--ink); box-shadow: var(--shadow);
    padding: 16px 20px; text-align: center; transform: rotate(4deg); min-width: 160px;
    animation: wobble 6s ease-in-out infinite;
  }
  .score strong { display: block; font-size: 3.2rem; line-height: 1; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; position: relative; z-index: 1; }

  .shape { position: absolute; pointer-events: none; z-index: 0; animation: float 7s ease-in-out infinite; }
  .shape.s1 { right: 26%; top: 34px; width: 56px; height: 56px; border-radius: 50%; background: var(--blue); border: 3px solid var(--ink); }
  .shape.s2 { right: 6%; bottom: 10px; font-size: 3.4rem; color: var(--pink); -webkit-text-stroke: 2px var(--ink); animation-delay: -2s; }
  .shape.s3 { left: 52%; bottom: 0; width: 70px; height: 26px; background: var(--green); border: 3px solid var(--ink); border-radius: 99px; animation-delay: -4s; }
  .shape.s4 { right: 40%; top: 6px; font-size: 2.2rem; color: var(--orange); -webkit-text-stroke: 2px var(--ink); animation-delay: -1s; }

  /* ---------- Ticker ---------- */
  .tickers { overflow: hidden; padding: 8px 0; }
  .block p, .block li, .d-hero h1, .row .t { overflow-wrap: anywhere; }
  .ticker { background: var(--ink); color: var(--paper); overflow: hidden; white-space: nowrap; transform: rotate(-1deg); margin: 0 -10px; }
  .ticker.alt { background: var(--yellow); color: var(--ink); transform: rotate(1deg); margin-top: -8px; border-block: 3px solid var(--ink); }
  .ticker-track { display: inline-flex; padding: 12px 0; font-family: "Space Mono", ui-monospace, monospace; text-transform: uppercase; font-size: .9rem; animation: ticker 36s linear infinite; }
  .ticker.alt .ticker-track { animation-direction: reverse; animation-duration: 44s; }
  .ticker-track span { padding: 0 20px; }

  /* ---------- Etapas (home) ---------- */
  .stages { display: grid; gap: 34px; padding: 48px 0 40px; }
  .stage {
    background: var(--white); border: 3px solid var(--ink); box-shadow: var(--shadow);
    padding: 26px; position: relative;
    transition: transform .15s ease, box-shadow .15s ease;
    animation: rise .6s ease backwards; animation-delay: var(--d, 0s);
  }
  .stage::before {
    content: ""; position: absolute; top: -3px; left: -3px; right: -3px; height: 14px;
    background: var(--c); border: 3px solid var(--ink); border-bottom: none;
  }
  .stage:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--ink); }
  .stage-head { display: flex; gap: 18px; align-items: flex-start; margin-top: 6px; }
  .num { font-size: 4rem; font-weight: 700; line-height: .9; color: var(--c); -webkit-text-stroke: 2px var(--ink); }
  .stage h2 { font-size: 1.7rem; line-height: 1.1; margin: 6px 0 0; }
  .goal { margin: 16px 0; font-size: 1.05rem; }
  .stamp {
    position: absolute; right: 22px; top: 26px;
    font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; text-transform: uppercase;
    border: 3px solid var(--ink); background: var(--c); padding: 4px 12px;
    transform: rotate(8deg) scale(0); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .stage.complete .stamp { transform: rotate(8deg) scale(1); }

  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(22px, 1fr)); gap: 6px; }
  .cells i { height: 16px; border: 2px solid var(--ink); background: var(--white); transition: background .2s ease; }
  .cells i.on { background: var(--c); }
  .count { margin: 8px 0 0; }
  .sub-label {
    font-family: "Space Mono", ui-monospace, monospace; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
    margin: 22px 0 4px; display: inline-block; background: var(--ink); color: var(--paper); padding: 2px 8px;
  }

  .row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    padding: 8px 6px; border-bottom: 1px dashed rgba(21, 19, 15, .25);
    transition: background .15s ease;
  }
  .row:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
  .row a.text { text-decoration: none; padding: 4px 0; display: block; }
  .row a.text:hover .t { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .row .go { font-size: 1.2rem; transition: transform .15s ease; text-decoration: none; }
  .row:hover .go { transform: translateX(4px); }
  .row.done .t { text-decoration: line-through; opacity: .55; }

  .check {
    appearance: none; -webkit-appearance: none;
    width: 26px; height: 26px; margin: 0;
    border: 3px solid var(--ink); background: var(--white);
    display: grid; place-content: center; cursor: pointer; flex-shrink: 0;
    transition: transform .12s ease;
  }
  .check:hover { transform: rotate(-6deg); }
  .check:checked { background: var(--c); }
  .check:checked::after { content: "✓"; font-weight: 700; font-size: 17px; line-height: 1; }
  .check:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

  .tag {
    display: inline-block; font-family: "Space Mono", ui-monospace, monospace; font-size: .68rem; text-transform: uppercase;
    border: 2px solid var(--ink); padding: 0 6px; margin-right: 8px; vertical-align: 1px; background: var(--white);
  }
  .tag.test { background: var(--ink); color: var(--paper); }

  /* ---------- Painel de sincronização ---------- */
  .panel {
    background: var(--ink); color: var(--paper); border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--pink); padding: 28px; margin-bottom: 80px;
  }
  .panel .label { color: var(--yellow); }
  .panel h2 { font-size: 1.6rem; margin: 8px 0 10px; }
  .panel p { margin: 0 0 12px; max-width: 70ch; }
  .panel .hint { opacity: .75; font-size: .92rem; }
  .panel details { margin-top: 12px; }
  .panel summary { cursor: pointer; font-family: "Space Mono", ui-monospace, monospace; font-size: .85rem; color: var(--yellow); }
  .panel code { background: rgba(255, 255, 255, .12); }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .panel input[type="password"] {
    flex: 1; min-width: 220px; padding: 12px 14px; border: 3px solid var(--paper);
    background: var(--white); color: var(--ink); font: inherit;
  }
  .btn {
    font-family: "Space Mono", ui-monospace, monospace; font-size: .85rem; text-transform: uppercase;
    padding: 11px 16px; border: 3px solid var(--ink); background: var(--white); color: var(--ink);
    cursor: pointer; box-shadow: 4px 4px 0 var(--ink); text-decoration: none; display: inline-block;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .panel .btn { border-color: var(--paper); background: transparent; color: var(--paper); box-shadow: 4px 4px 0 var(--paper); }
  .panel .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
  .status { font-family: "Space Mono", ui-monospace, monospace; font-size: .88rem; color: var(--yellow); min-height: 1.4em; margin: 16px 0 0; }
  .status.error { color: var(--pink); }

  /* ---------- Página de detalhe ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 26px 0 0; }
  .crumb { font-family: "Space Mono", ui-monospace, monospace; font-size: .85rem; text-transform: uppercase; text-decoration: none; }
  .crumb:hover { text-decoration: underline; }

  .d-hero {
    background: var(--c); border: 3px solid var(--ink); box-shadow: var(--shadow);
    padding: 34px 30px; margin: 22px 0 34px; position: relative; overflow: hidden;
  }
  .d-hero::after {
    content: attr(data-big); position: absolute; right: -10px; bottom: -40px;
    font-size: 11rem; font-weight: 700; line-height: 1; color: transparent;
    -webkit-text-stroke: 2px rgba(21, 19, 15, .22); pointer-events: none;
  }
  .d-hero h1 { font-size: clamp(1.8rem, 4.6vw, 3.1rem); line-height: 1.05; letter-spacing: -.02em; margin: 14px 0 12px; max-width: 22ch; position: relative; z-index: 1; }
  .d-hero .summary { font-size: 1.15rem; max-width: 52ch; margin: 0 0 20px; position: relative; z-index: 1; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: relative; z-index: 1; }
  .chip { font-family: "Space Mono", ui-monospace, monospace; font-size: .78rem; text-transform: uppercase; border: 2px solid var(--ink); background: var(--white); padding: 3px 10px; }
  .chip.dark { background: var(--ink); color: var(--paper); }
  .toggle-done { display: inline-flex; gap: 10px; align-items: center; }
  .toggle-done.on { background: var(--ink); color: var(--c); }

  .d-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 30px; align-items: start; }
  .d-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; min-width: 0; }
  .d-side { position: sticky; top: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
  .block { background: var(--white); border: 3px solid var(--ink); padding: 24px; position: relative; }
  .block h2 {
    font-size: 1.25rem; margin: 0 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .block h2 .ico {
    display: inline-grid; place-content: center; width: 32px; height: 32px; flex-shrink: 0;
    background: var(--c); border: 2px solid var(--ink); font-size: 1rem;
  }
  .block p { margin: 0 0 10px; }
  .block p:last-child { margin-bottom: 0; }
  .block.prompt { background: var(--ink); color: var(--paper); box-shadow: 6px 6px 0 var(--c); }
  .block.prompt code { background: rgba(255, 255, 255, .14); }
  .block.prompt h2 .ico { color: var(--ink); }

  ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 12px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
  ol.steps li::before {
    content: counter(s); display: grid; place-content: center; width: 30px; height: 30px;
    border: 2px solid var(--ink); background: var(--c); font-family: "Space Mono", ui-monospace, monospace; font-weight: 700;
  }
  ul.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  ul.checks li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
  ul.checks li::before { content: "✓"; display: grid; place-content: center; width: 22px; height: 22px; border: 2px solid var(--ink); font-weight: 700; font-size: .8rem; margin-top: 2px; }
  ul.warn { padding-left: 0; list-style: none; margin: 0; display: grid; gap: 10px; }
  ul.warn li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
  ul.warn li::before { content: "!"; display: grid; place-content: center; width: 22px; height: 22px; background: var(--pink); border: 2px solid var(--ink); font-weight: 700; margin-top: 2px; }
  .block.warn-block { background: color-mix(in srgb, var(--pink) 14%, var(--white)); }

  .code { border: 3px solid var(--ink); background: #1b1915; color: #f4efe6; margin: 14px 0 0; position: relative; }
  .code-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 2px solid #3a362e; }
  .code-head .label { color: var(--c); font-size: .72rem; }
  .copy { font-family: "Space Mono", ui-monospace, monospace; font-size: .7rem; text-transform: uppercase; background: transparent; color: #f4efe6; border: 2px solid #5a554b; padding: 2px 8px; cursor: pointer; }
  .copy:hover { border-color: var(--c); color: var(--c); }
  .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: "Space Mono", ui-monospace, monospace; font-size: .82rem; line-height: 1.6; }
  .code pre code, .block.prompt .code pre code { background: none; padding: 0; font-size: inherit; }
  .prompt .code { margin-top: 18px; border-color: var(--c); }

  .hint {
    border: 2px dashed var(--ink); padding: 12px 14px; margin-top: 12px; display: grid;
    grid-template-columns: auto 1fr; gap: 12px; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .hint b { font-family: "Space Mono", ui-monospace, monospace; background: var(--c); border: 2px solid var(--ink); padding: 0 6px; height: fit-content; }
  .hints-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .muted { opacity: .7; font-size: .92rem; }

  .locked { text-align: center; padding: 30px 18px; border: 3px dashed var(--ink); background: repeating-linear-gradient(-45deg, transparent 0 10px, rgba(21,19,15,.05) 10px 20px); }
  .locked .big { font-size: 2.6rem; line-height: 1; display: block; margin-bottom: 10px; }
  .solution { animation: enter .5s ease; }

  .side-card { background: var(--white); border: 3px solid var(--ink); padding: 18px; }
  .side-card h3 { margin: 0 0 10px; font-size: 1rem; }
  .side-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .side-card a { font-size: .95rem; text-underline-offset: 3px; }
  .side-card a::after { content: " ↗"; }
  .side-card.mini .cells i { height: 12px; }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 40px 0 80px; }
  .pager a {
    text-decoration: none; border: 3px solid var(--ink); background: var(--white); padding: 18px; box-shadow: var(--shadow);
    display: grid; gap: 6px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .pager a:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--ink); background: var(--pc, var(--yellow)); }
  .pager a.next { text-align: right; }
  .pager .t { font-weight: 700; }

  .notfound { padding: 80px 0; text-align: center; }

  /* ---------- Efeitos ---------- */
  .confetti { position: fixed; pointer-events: none; z-index: 1000; width: 10px; height: 14px; border: 2px solid var(--ink); }
  .trail { position: fixed; pointer-events: none; z-index: 999; width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; transform: translate(-50%, -50%); animation: trail .7s ease-out forwards; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(140%);
    background: var(--ink); color: var(--paper); padding: 12px 20px; border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--pink); font-family: "Space Mono", ui-monospace, monospace; font-size: .85rem;
    z-index: 1001; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), visibility .35s; max-width: calc(100% - 32px);
    visibility: hidden;
  }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }

  @keyframes ticker { to { transform: translateX(-50%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(10deg); } }
  @keyframes wobble { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-2deg); } }
  @keyframes trail { to { transform: translate(-50%, -50%) scale(0); opacity: 0; } }

  @media (max-width: 860px) {
    .d-grid { grid-template-columns: minmax(0, 1fr); }
    .d-side { position: static; }
  }
  @media (max-width: 720px) {
    .score { position: static; transform: rotate(-2deg); display: inline-block; margin-top: 24px; animation: none; }
    .shape.s1, .shape.s4 { display: none; }
    .num { font-size: 3rem; }
    .stage { padding: 22px 18px; }
    .stage h2 { font-size: 1.4rem; }
    .stamp { top: 18px; right: 12px; font-size: .75rem; }
    .panel, .block { padding: 20px; }
    .d-hero { padding: 26px 20px; }
    .d-hero::after { font-size: 7rem; bottom: -24px; }
    .pager { grid-template-columns: 1fr; }
    .row { grid-template-columns: auto 1fr; }
    .row .go { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div id="view"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script>
  const STORAGE_KEY = "roadmap-progress-v1";
  const GIST_KEY = "roadmap-gist-v1";
  const HINTS_KEY = "roadmap-hints-v1";
  const FILE_NAME = "roadmap-progress.json";
  const API = "https://api.github.com";
  const COLORS = ["#ffd23f", "#ff7ab6", "#7aa2ff", "#6ee7b7", "#ff9f5a", "#c4b5fd"];
  const STAGES = window.ROADMAP;
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Índice plano para navegação entre itens */
  const FLAT = [];
  STAGES.forEach((stage, si) => {
    const order = [...stage.items.filter((i) => i.type === "req"), ...stage.items.filter((i) => i.type === "test")];
    order.forEach((item) => {
      const n = stage.items.filter((i) => i.type === item.type).indexOf(item) + 1;
      FLAT.push({ item, stage, si, color: COLORS[si % COLORS.length], code: (item.type === "test" ? "T" : "R") + si + "." + n });
    });
  });
  const BY_ID = new Map(FLAT.map((e) => [e.item.id, e]));

  let state = loadJSON(STORAGE_KEY, null) || { checked: {}, updatedAt: null };
  if (!state.checked) state = { checked: {}, updatedAt: null };
  let gist = loadJSON(GIST_KEY, null);
  let hintsSeen = loadJSON(HINTS_KEY, {}) || {};
  let syncTimer = null;
  let lastStatus = { msg: "", err: false };

  /* ---------- Utilidades ---------- */

  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* armazenamento indisponível */ }
  }
  function persistLocal() { saveJSON(STORAGE_KEY, state); }
  function touch() { state.updatedAt = new Date().toISOString(); }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  /* Texto simples com `código` e **negrito** */
  function rich(tag, text, className) {
    const node = el(tag, className);
    node.innerHTML = escapeHTML(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return node;
  }
  function pct(done, total) { return total ? Math.round((done / total) * 100) : 0; }

  function toast(message) {
    const t = document.getElementById("toast");
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function setStatus(message, isError = false) {
    lastStatus = { msg: message, err: isError };
    const node = document.getElementById("syncStatus");
    if (!node) return;
    node.textContent = message;
    node.className = isError ? "status error" : "status";
  }

  /* ---------- Efeitos visuais ---------- */

  function confetti(x, y, colors) {
    if (REDUCED) return;
    for (let i = 0; i < 26; i++) {
      const p = el("div", "confetti");
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = colors[i % colors.length];
      if (i % 3 === 0) p.style.borderRadius = "50%";
      document.body.append(p);
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 120;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 60;
      p.animate([
        { transform: "translate(0,0) rotate(0)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 160}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => p.remove();
    }
  }

  function setupTrail() {
    if (REDUCED || !window.matchMedia("(pointer: fine)").matches) return;
    let last = 0;
    let n = 0;
    window.addEventListener("pointermove", (e) => {
      const now = performance.now();
      if (now - last < 40) return;
      last = now;
      const d = el("div", "trail");
      d.style.left = e.clientX + "px";
      d.style.top = e.clientY + "px";
      d.style.background = COLORS[n++ % COLORS.length];
      document.body.append(d);
      setTimeout(() => d.remove(), 700);
    }, { passive: true });
  }

  /* ---------- Progresso ---------- */

  function setChecked(id, value, originEl) {
    state.checked[id] = value;
    touch();
    persistLocal();
    scheduleSync();
    if (value && originEl) {
      const r = originEl.getBoundingClientRect();
      const entry = BY_ID.get(id);
      confetti(r.left + r.width / 2, r.top + r.height / 2, [entry.color, "#15130f", "#fffdf8", COLORS[(entry.si + 2) % COLORS.length]]);
      const stage = entry.stage;
      if (stage.items.every((i) => state.checked[i.id])) toast("Etapa \"" + stage.title + "\" concluída!");
    }
  }

  function stageProgress(stage) {
    const done = stage.items.filter((i) => state.checked[i.id]).length;
    return { done, total: stage.items.length };
  }
  function overallProgress() {
    let done = 0, total = 0;
    for (const s of STAGES) { const p = stageProgress(s); done += p.done; total += p.total; }
    return pct(done, total);
  }

  function cellsFor(stage) {
    const wrap = el("div", "cells");
    stage.items.forEach((i) => { const c = el("i"); if (state.checked[i.id]) c.classList.add("on"); wrap.append(c); });
    return wrap;
  }

  /* ---------- Página inicial ---------- */

  function ticker(alt) {
    const t = el("div", "ticker" + (alt ? " alt" : ""));
    t.setAttribute("aria-hidden", "true");
    const track = el("div", "ticker-track");
    const words = alt
      ? ["tente antes", "erre cedo", "entenda de verdade", "commit todo dia", "explique em voz alta", "termine o que começou"]
      : STAGES.map((s) => s.title);
    for (let copy = 0; copy < 2; copy++) for (const w of words) track.append(el("span", "", w + " ✦"));
    t.append(track);
    return t;
  }

  function renderHome() {
    document.title = "Roadmap para dev júnior 2027";
    const root = document.createDocumentFragment();

    const hero = el("header", "hero wrap");
    hero.innerHTML = `
      <span class="shape s1"></span><span class="shape s2">✦</span>
      <span class="shape s3"></span><span class="shape s4">★</span>
      <p class="label">[ roadmap // out/2026 → fev/2027 ]</p>
      <h1>Dev<br><em>júnior</em><span class="hl">.</span></h1>
      <p class="lede">17 semanas, 6 etapas, 33 checkpoints. Abra cada item para ver o que fazer, as dicas e a solução. Marque só depois de passar no teste.</p>
      <div class="legend"><span class="tag">requisito</span><span class="muted">o que estudar e construir</span><span class="tag test">teste</span><span class="muted">como provar que aprendeu</span></div>
      <div class="score"><p class="label">concluído</p><strong id="overall"></strong></div>`;
    const tickers = el("div", "tickers");
    tickers.append(ticker(false), ticker(true));
    root.append(hero, tickers);

    const stagesWrap = el("main", "stages wrap");
    STAGES.forEach((stage, si) => {
      const color = COLORS[si % COLORS.length];
      const card = el("article", "stage");
      card.id = "etapa-" + stage.id;
      card.style.setProperty("--c", color);
      card.style.setProperty("--d", (si * 0.08) + "s");

      const head = el("div", "stage-head");
      head.append(el("span", "num", String(si).padStart(2, "0")));
      const titleBox = el("div");
      titleBox.append(el("p", "label", stage.weeks), el("h2", "", stage.title));
      head.append(titleBox);
      const stamp = el("span", "stamp", "feito!");
      const count = el("p", "label count");
      card.append(stamp, head, el("p", "goal", stage.goal), cellsFor(stage), count);

      const refresh = () => {
        const p = stageProgress(stage);
        count.textContent = `${p.done} de ${p.total} concluídos`;
        card.classList.toggle("complete", p.done === p.total);
        card.querySelectorAll(".cells i").forEach((c, i) => c.classList.toggle("on", !!state.checked[stage.items[i].id]));
        document.getElementById("overall").textContent = overallProgress() + "%";
      };

      for (const [type, heading] of [["req", "Requisitos"], ["test", "Testes"]]) {
        const items = stage.items.filter((i) => i.type === type);
        if (!items.length) continue;
        card.append(el("span", "sub-label", heading));
        for (const item of items) {
          const row = el("div", "row" + (state.checked[item.id] ? " done" : ""));
          const box = el("input", "check");
          box.type = "checkbox";
          box.checked = !!state.checked[item.id];
          box.setAttribute("aria-label", "Concluído: " + item.text);
          box.addEventListener("change", () => {
            setChecked(item.id, box.checked, box);
            row.classList.toggle("done", box.checked);
            refresh();
          });
          const link = el("a", "text");
          link.href = "#/item/" + item.id;
          link.append(el("span", "tag" + (type === "test" ? " test" : ""), BY_ID.get(item.id).code), el("span", "t", item.text));
          const go = el("a", "go", "→");
          go.href = link.href;
          go.setAttribute("aria-hidden", "true");
          go.tabIndex = -1;
          row.append(box, link, go);
          card.append(row);
        }
      }
      stagesWrap.append(card);
      card._refresh = refresh;
    });
    root.append(stagesWrap);
    root.append(renderSyncPanel());

    const view = document.getElementById("view");
    view.replaceChildren(root);
    view.querySelectorAll(".stage").forEach((c) => c._refresh());
  }

  function renderSyncPanel() {
    const wrap = el("div", "wrap");
    wrap.innerHTML = `
      <section class="panel" id="nuvem">
        <p class="label">[ sincronização ]</p>
        <h2>Salvar na nuvem</h2>
        <p>O progresso fica salvo neste navegador automaticamente. Para ter uma cópia na nuvem e usar em vários dispositivos, conecte um Gist secreto do seu GitHub. É gratuito e não precisa de servidor.</p>
        <div class="controls">
          <input type="password" id="token" placeholder="Token do GitHub (somente escopo gist)" autocomplete="off">
          <button id="connect" class="btn primary">Conectar</button>
        </div>
        <div class="controls">
          <button id="pull" class="btn">Carregar da nuvem</button>
          <button id="disconnect" class="btn">Desconectar</button>
        </div>
        <p class="status" id="syncStatus"></p>
        <details>
          <summary>Como criar o token</summary>
          <p class="hint">GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic). Marque apenas o escopo <strong>gist</strong>. O token fica só no localStorage deste navegador e nunca vai para o repositório.</p>
        </details>
        <details>
          <summary>Exportar ou importar manualmente</summary>
          <div class="controls">
            <button id="exportBtn" class="btn">Exportar JSON</button>
            <input type="file" id="importFile" accept="application/json">
          </div>
        </details>
      </section>`;
    wireSync(wrap);
    queueMicrotask(() => setStatus(lastStatus.msg, lastStatus.err));
    return wrap;
  }

  /* ---------- Página de detalhe ---------- */

  function codeBlock(c) {
    const box = el("div", "code");
    const head = el("div", "code-head");
    head.append(el("span", "label", c.label || c.lang));
    const copy = el("button", "copy", "copiar");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(c.src); copy.textContent = "copiado!"; }
      catch (e) { copy.textContent = "erro"; }
      setTimeout(() => (copy.textContent = "copiar"), 1500);
    });
    head.append(copy);
    const pre = el("pre");
    pre.append(el("code", "", c.src));
    box.append(head, pre);
    return box;
  }

  function block(title, icon, className) {
    const b = el("section", "block" + (className ? " " + className : ""));
    const h = el("h2");
    h.append(el("span", "ico", icon), document.createTextNode(title));
    b.append(h);
    return b;
  }

  function listOf(items, className, tag = "ul") {
    const l = el(tag, className);
    items.forEach((t) => { const li = el("li"); li.append(rich("span", t)); l.append(li); });
    return l;
  }

  function renderDetail(id) {
    const entry = BY_ID.get(id);
    const view = document.getElementById("view");
    if (!entry) {
      view.replaceChildren();
      const nf = el("div", "wrap notfound");
      nf.innerHTML = `<p class="label">[ 404 ]</p><h1>Item não encontrado</h1><a class="btn primary" href="#/">Voltar ao roadmap</a>`;
      view.append(nf);
      return;
    }
    const { item, stage, si, color, code } = entry;
    const isTest = item.type === "test";
    document.title = code + " · " + item.text;
    document.body.style.setProperty("--c", color);

    const page = el("div", "wrap");
    page.style.setProperty("--c", color);

    /* barra superior */
    const top = el("div", "topbar");
    const back = el("a", "crumb", "← voltar ao roadmap");
    back.href = "#/";
    back.addEventListener("click", () => { sessionStorage.setItem("roadmap-scroll", "etapa-" + stage.id); });
    top.append(back, el("span", "label", "etapa " + String(si).padStart(2, "0") + " · " + stage.title));
    page.append(top);

    /* cabeçalho */
    const hero = el("header", "d-hero");
    hero.dataset.big = code;
    hero.append(el("p", "label", (isTest ? "teste " : "requisito ") + code + " · " + stage.weeks));
    hero.append(el("h1", "", item.text));
    if (item.summary) hero.append(el("p", "summary", item.summary));
    const chips = el("div", "chips");
    chips.append(el("span", "chip" + (isTest ? " dark" : ""), isTest ? "teste" : "requisito"));
    if (item.time) chips.append(el("span", "chip", "⏱ " + item.time));
    const toggle = el("button", "btn toggle-done");
    const paintToggle = () => {
      const on = !!state.checked[item.id];
      toggle.classList.toggle("on", on);
      toggle.textContent = on ? "✓ concluído" : (isTest ? "marcar como aprovado" : "marcar como concluído");
    };
    toggle.addEventListener("click", () => {
      setChecked(item.id, !state.checked[item.id], toggle);
      paintToggle();
      paintMini();
    });
    paintToggle();
    chips.append(toggle);
    hero.append(chips);
    page.append(hero);

    /* conteúdo */
    const grid = el("div", "d-grid");
    const main = el("div", "d-main");

    if (isTest) {
      const p = block("Enunciado", "?", "prompt");
      p.append(rich("p", item.prompt));
      if (item.given) p.append(codeBlock(item.given));
      main.append(p);
      if (item.done) { const b = block("Critérios de aprovação", "✓"); b.append(listOf(item.done, "checks")); main.append(b); }
      if (item.hints && item.hints.length) main.append(renderHints(item));
      if (item.solution) main.append(renderSolution(item));
    } else {
      if (item.why) { const b = block("Por que isso importa", "★"); b.append(rich("p", item.why)); main.append(b); }
      if (item.todo) { const b = block("O que deve acontecer", "→"); b.append(listOf(item.todo, "steps", "ol")); main.append(b); }
      if (item.code) { const b = block("Exemplo", "{ }"); b.append(codeBlock(item.code)); main.append(b); }
      if (item.done) { const b = block("Como saber que está pronto", "✓"); b.append(listOf(item.done, "checks")); main.append(b); }
    }
    if (item.pitfalls && item.pitfalls.length) {
      const b = block("Armadilhas comuns", "!", "warn-block");
      b.append(listOf(item.pitfalls, "warn"));
      main.append(b);
    }

    /* lateral */
    const side = el("aside", "d-side");
    const mini = el("div", "side-card mini");
    mini.append(el("p", "label", "progresso da etapa"));
    const miniCount = el("h3");
    const miniCells = el("div");
    mini.append(miniCount, miniCells);
    function paintMini() {
      const p = stageProgress(stage);
      miniCount.textContent = p.done + " de " + p.total;
      miniCells.replaceChildren(cellsFor(stage));
    }
    paintMini();
    side.append(mini);

    if (item.resources && item.resources.length) {
      const r = el("div", "side-card");
      r.append(el("h3", "", "Para estudar"));
      const ul = el("ul");
      item.resources.forEach((res) => {
        const li = el("li");
        const a = el("a", "", res.l);
        a.href = res.u;
        a.target = "_blank";
        a.rel = "noopener";
        li.append(a);
        ul.append(li);
      });
      r.append(ul);
      side.append(r);
    }

    const rule = el("div", "side-card");
    rule.append(el("h3", "", "Regra do roadmap"));
    rule.append(el("p", "muted", isTest
      ? "Tente sozinho primeiro. Use as dicas uma de cada vez e só abra a solução depois de uma tentativa de verdade."
      : "Escreva o código você mesmo. Use IA para tirar dúvidas e revisar, não para gerar a solução."));
    side.append(rule);

    grid.append(main, side);
    page.append(grid);

    /* anterior / próximo */
    const idx = FLAT.indexOf(entry);
    const pager = el("nav", "pager");
    const prev = FLAT[idx - 1];
    const next = FLAT[idx + 1];
    pager.append(prev ? pagerLink(prev, "← anterior", "prev") : el("span"));
    pager.append(next ? pagerLink(next, "próximo →", "next") : el("span"));
    page.append(pager);

    view.replaceChildren(page);
  }

  function pagerLink(entry, label, cls) {
    const a = el("a", cls);
    a.href = "#/item/" + entry.item.id;
    a.style.setProperty("--pc", entry.color);
    a.append(el("span", "label", label + " · " + entry.code), el("span", "t", entry.item.text));
    return a;
  }

  function renderHints(item) {
    const b = block("Dicas", "💡");
    b.append(el("p", "muted", "Revele uma por vez, só quando travar."));
    const list = el("div");
    const actions = el("div", "hints-actions");
    const btn = el("button", "btn");
    let shown = 0;
    const showNext = (animate = true) => {
      const h = el("div", "hint");
      if (!animate) h.style.animation = "none";
      h.append(el("b", "", String(shown + 1)), rich("span", item.hints[shown]));
      list.append(h);
      shown++;
      hintsSeen[item.id] = shown;
      saveJSON(HINTS_KEY, hintsSeen);
      paint();
    };
    const paint = () => {
      if (shown >= item.hints.length) { btn.remove(); actions.append(el("span", "muted", "Todas as dicas reveladas.")); return; }
      btn.textContent = `revelar dica ${shown + 1} de ${item.hints.length}`;
    };
    btn.addEventListener("click", () => showNext(true));
    const already = Math.min(hintsSeen[item.id] || 0, item.hints.length);
    for (let i = 0; i < already; i++) showNext(false);
    actions.append(btn);
    paint();
    b.append(list, actions);
    return b;
  }

  function renderSolution(item) {
    const b = block("Solução de referência", "◎");
    const locked = el("div", "locked");
    locked.append(el("span", "big", "🔒"));
    locked.append(el("p", "", "A solução está escondida para você tentar primeiro."));
    const btn = el("button", "btn primary", "já tentei, mostrar solução");
    btn.addEventListener("click", () => {
      if (!window.confirm("Você já tentou resolver sozinho? A solução vale mais depois de uma tentativa de verdade.")) return;
      const sol = el("div", "solution");
      (item.solution.notes || []).forEach((n) => sol.append(rich("p", n)));
      if (item.solution.code) sol.append(codeBlock(item.solution.code));
      locked.replaceWith(sol);
    });
    locked.append(btn);
    b.append(locked);
    return b;
  }

  /* ---------- Roteamento ---------- */

  function route() {
    const hash = location.hash || "#/";
    const view = document.getElementById("view");
    view.style.animation = "none";
    void view.offsetWidth;
    view.style.animation = "";
    const m = hash.match(/^#\/item\/([\w-]+)$/);
    if (m) {
      renderDetail(m[1]);
      window.scrollTo({ top: 0, behavior: "instant" });
    } else {
      document.body.style.removeProperty("--c");
      renderHome();
      const target = sessionStorage.getItem("roadmap-scroll");
      sessionStorage.removeItem("roadmap-scroll");
      const node = target && document.getElementById(target);
      if (node) node.scrollIntoView({ behavior: "instant", block: "start" });
      else window.scrollTo({ top: 0, behavior: "instant" });
    }
  }

  /* ---------- Sincronização com Gist secreto do GitHub ---------- */

  async function gh(path, options = {}) {
    const res = await fetch(API + path, {
      ...options,
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": "token " + gist.token,
        "Content-Type": "application/json",
      },
    });
    if (!res.ok) throw new Error(res.status === 401 ? "token inválido ou sem escopo gist" : "GitHub respondeu " + res.status);
    return res.json();
  }

  function scheduleSync() {
    if (!gist || !gist.token) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushToCloud, 800);
  }

  async function pushToCloud() {
    if (!gist || !gist.token) return;
    setStatus("Salvando na nuvem…");
    const content = JSON.stringify(state, null, 2);
    try {
      if (gist.gistId) {
        await gh("/gists/" + gist.gistId, { method: "PATCH", body: JSON.stringify({ files: { [FILE_NAME]: { content } } }) });
      } else {
        const created = await gh("/gists", {
          method: "POST",
          body: JSON.stringify({ description: "Roadmap dev júnior - progresso", public: false, files: { [FILE_NAME]: { content } } }),
        });
        gist.gistId = created.id;
        saveJSON(GIST_KEY, gist);
      }
      setStatus("Salvo na nuvem às " + new Date().toLocaleTimeString("pt-BR"));
    } catch (e) {
      setStatus("Não consegui salvar na nuvem (" + e.message + "). Seu progresso continua salvo neste navegador.", true);
      toast("Falha ao salvar na nuvem");
    }
  }

  async function pullFromCloud() {
    if (!gist || !gist.gistId) return null;
    setStatus("Carregando da nuvem…");
    try {
      const data = await gh("/gists/" + gist.gistId);
      const file = data.files && data.files[FILE_NAME];
      if (!file) throw new Error("arquivo de progresso não encontrado no Gist");
      const cloud = JSON.parse(file.content);
      if (!cloud || !cloud.checked) throw new Error("conteúdo do Gist inválido");
      return cloud;
    } catch (e) {
      setStatus("Não consegui carregar da nuvem (" + e.message + ").", true);
      return null;
    }
  }

  function adoptCloudIfNewer(cloud) {
    if (cloud && cloud.updatedAt && (!state.updatedAt || cloud.updatedAt > state.updatedAt)) {
      state = cloud;
      persistLocal();
      route();
      return true;
    }
    return false;
  }

  function wireSync(scope) {
    const $ = (sel) => scope.querySelector(sel);
    $("#connect").addEventListener("click", async () => {
      const input = $("#token");
      const token = input.value.trim();
      if (!token) { setStatus("Cole o token primeiro.", true); return; }
      gist = { token, gistId: gist ? gist.gistId : null };
      saveJSON(GIST_KEY, gist);
      input.value = "";
      if (gist.gistId) {
        const cloud = await pullFromCloud();
        if (cloud) {
          if (adoptCloudIfNewer(cloud)) setStatus("Conectado. Progresso mais recente carregado da nuvem.");
          else { setStatus("Conectado. Seu progresso local é o mais recente."); pushToCloud(); }
        }
      } else {
        await pushToCloud();
      }
    });
    $("#pull").addEventListener("click", async () => {
      const cloud = await pullFromCloud();
      if (cloud) { state = cloud; persistLocal(); route(); setStatus("Progresso carregado da nuvem."); }
    });
    $("#disconnect").addEventListener("click", () => {
      try { localStorage.removeItem(GIST_KEY); } catch (e) { /* ignora */ }
      gist = null;
      setStatus("Desconectado. O progresso continua salvo neste navegador.");
    });
    $("#exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = FILE_NAME;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    $("#importFile").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!data || !data.checked) throw new Error("formato inválido");
        state = data;
        touch();
        persistLocal();
        scheduleSync();
        route();
        setStatus("Progresso importado.");
      } catch (e) {
        setStatus("Arquivo inválido: " + e.message, true);
      }
    });
  }

  /* ---------- Inicialização ---------- */

  async function init() {
    setupTrail();
    window.addEventListener("hashchange", route);
    route();
    if (gist && gist.token && gist.gistId) {
      const cloud = await pullFromCloud();
      if (cloud) { adoptCloudIfNewer(cloud); setStatus("Conectado à nuvem."); }
    } else if (gist && gist.token) {
      setStatus("Conectado. Marque algum item para criar o Gist.");
    }
  }

  init();
</script>
